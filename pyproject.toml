[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "office-agent"
version = "1.0.0"
description = "Multi-agent system for building Word, Excel and PowerPoint documents with code-verified quality gates"
requires-python = ">=3.10"
dependencies = [
  "python-pptx>=1.0.2",
  "python-docx>=1.1.0",
  "openpyxl>=3.1.0",
  "Pillow>=10.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
